name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing ships untested: a tag runs the full CI (both OSes + lint/vulncheck)
  # before any artifact is built.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build releases with the newest stable Go so shipped binaries carry
      # current stdlib security fixes; go.mod's 1.22 stays the source-build
      # minimum and is verified by the test job.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      # Each tarball ships profiles/ beside the binary — the third leg of
      # shell.ResolveProfile's lookup — so an extracted dir works standalone.
      # man/ is generated once from the live command tree and bundled too.
      # THIRD_PARTY_LICENSES is generated per GOOS/GOARCH from the modules
      # actually linked into that binary (Cobra and pflag are Apache-2.0 and
      # BSD-3-Clause, which require their license text with a binary).
      - name: build release artifacts
        run: |
          set -euo pipefail
          make man
          for os in linux darwin; do
            for arch in amd64 arm64; do
              dir="shellenv-${GITHUB_REF_NAME}-${os}-${arch}"
              mkdir -p "release/$dir"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -ldflags "-X github.com/systemhalted/shellenv/internal/cli.version=${GITHUB_REF_NAME}" \
                -o "release/$dir/shellenv" ./cmd/shellenv
              GOOS="$os" GOARCH="$arch" ./scripts/third-party-licenses.sh \
                > "release/$dir/THIRD_PARTY_LICENSES"
              cp -r profiles man README.md LICENSE "release/$dir/"
              tar -C release -czf "release/$dir.tar.gz" "$dir"
            done
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          generate_release_notes: true
