name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Each tarball ships profiles/ beside the binary — the third leg of
      # shell.ResolveProfile's lookup — so an extracted dir works standalone.
      - name: build release artifacts
        run: |
          set -euo pipefail
          for os in linux darwin; do
            for arch in amd64 arm64; do
              dir="shellenv-${GITHUB_REF_NAME}-${os}-${arch}"
              mkdir -p "release/$dir"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -ldflags "-X github.com/systemhalted/shellenv/internal/cli.version=${GITHUB_REF_NAME}" \
                -o "release/$dir/shellenv" ./cmd/shellenv
              cp -r profiles README.md LICENSE "release/$dir/"
              tar -C release -czf "release/$dir.tar.gz" "$dir"
            done
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          generate_release_notes: true
