name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Linux verifies the declared minimum (go.mod's 1.22). macOS tests with
      # stable Go — the same toolchain darwin release artifacts are built
      # with — because Go 1.22.0 binaries lack the LC_UUID load command the
      # dyld on current macOS runners hard-requires (test binaries abort).
      - name: setup Go (Linux, go.mod minimum)
        if: runner.os == 'Linux'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: setup Go (macOS, stable)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build
        run: make build

      - name: install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: docker diagnostic (Linux)
        if: runner.os == 'Linux'
        run: docker version

      # On Linux the runner ships docker, so the container test must RUN, not
      # silently skip — SHELLENV_TEST_REQUIRE_CONTAINER enforces that. macOS
      # runners have no docker; the test skips gracefully there.
      - name: integration tests (Linux)
        if: runner.os == 'Linux'
        run: SHELLENV_HOME=$(mktemp -d) SHELLENV_TEST_REQUIRE_CONTAINER=1 bats -r test/integration

      - name: integration tests (macOS)
        if: runner.os == 'macOS'
        run: SHELLENV_HOME=$(mktemp -d) bats -r test/integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # staticcheck/govulncheck need a recent toolchain, and govulncheck's
      # stdlib scan is only meaningful against the newest patch release.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: lint
        run: make lint

      - name: govulncheck
        run: make vulncheck
